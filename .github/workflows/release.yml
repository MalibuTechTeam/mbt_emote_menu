name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  create-release:
    name: Build and Create Tagged release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Install archive tools
        run: sudo apt install zip

      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install web dependencies
        run: cd web && bun install --frozen-lockfile

      - name: Build NUI
        run: cd web && bun run build

      - name: Get variables
        id: get_vars
        run: |
          echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "DATE=$(date +'%D')" >> $GITHUB_OUTPUT

      - name: Bump manifest version
        run: bun .github/actions/bump-manifest-version.js
        env:
          TGT_RELEASE_VERSION: ${{ github.ref_name }}

      - name: Push manifest change
        uses: EndBug/add-and-commit@v9
        with:
          add: fxmanifest.lua
          push: true
          author_name: Manifest Bumper
          author_email: 41898282+github-actions[bot]@users.noreply.github.com
          message: "chore: bump manifest version to ${{ github.ref_name }}"

      - name: Update tag ref
        uses: EndBug/latest-tag@latest
        with:
          tag-name: ${{ github.ref_name }}

      - name: Bundle files
        run: |
          mkdir -p ./temp/mbt_emote_menu/web
          cp ./{README.md,config.lua,default.lua,fxmanifest.lua,LICENSE.md} ./temp/mbt_emote_menu
          cp -r ./{modules,core,locales} ./temp/mbt_emote_menu
          cp -r ./web/dist ./temp/mbt_emote_menu/web/dist
          # --- gate MBT.Debug -------------------------------------------------
          # Il default del PACCHETTO e' fail-closed, comunque sia il config.lua
          # di sviluppo. Tenere MBT.Debug = true mentre si lavora e' corretto e
          # voluto: serve per i test. Quello che non deve poter accadere e' che
          # finisca in una release -- e questo passaggio lo rende impossibile
          # invece di chiedere a qualcuno di ricordarsene prima del tag.
          #
          # Se il marcatore non c'e', il build FALLISCE: meglio non rilasciare
          # che rilasciare un default sconosciuto. Stesso contratto di
          # mbt_hud/scripts/build-release.mjs, che e' il modello del catalogo.
          #
          # Difetto che chiude: MBT.Debug e' gia' uscito TRE volte, e la
          # seconda perche' un `git add -A` lo aveva rimesso a true nel repo.
          CFG="./temp/mbt_emote_menu/config.lua"
          if grep -qE '^[[:space:]]*MBT\.Debug[[:space:]]*=[[:space:]]*true' "$CFG"; then
            sed -i -E 's/^([[:space:]]*MBT\.Debug[[:space:]]*=[[:space:]]*)true/\1false/' "$CFG"
            echo "gate: MBT.Debug era true, riscritto a false nel pacchetto"
          elif ! grep -qE '^[[:space:]]*MBT\.Debug[[:space:]]*=[[:space:]]*false' "$CFG"; then
            echo "config.lua: default di release MBT.Debug non trovato" >&2
            exit 1
          fi
          grep -E '^[[:space:]]*MBT\.Debug' "$CFG"
          # --------------------------------------------------------------------
          cd ./temp && zip -r ../mbt_emote_menu.zip ./mbt_emote_menu

      - name: Create Release
        uses: "marvinpinto/action-automatic-releases@v1.2.1"
        id: auto_release
        with:
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          title: "${{ github.ref_name }}"
          prerelease: false
          files: mbt_emote_menu.zip

        env:
          CI: false
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
